[[principles]]
id = "ensure-all-your-trousers-have-a-mid-"
text = "Ensure all your trousers have a mid or high rise, sitting at your natural waist."
reason = "This is the permanent solution to your untucked shirts and it creates the elongated proportions central to the 60s Milanese look you admire."
group = "Proportion"

[[principles]]
id = "every-jacket-and-top-must-follow-you"
text = "Every jacket and top must follow your natural shoulder line and be tailored to define your waist."
reason = "This is the most effective way to accentuate the athletic frame you want your clothes to highlight."
group = "Silhouette"

[[principles]]
id = "choose-only-natural-fibres-like-cott"
text = "Choose only natural fibres like cotton, linen, and wool over their synthetic alternatives."
reason = "Since you rated comfort a 10 and aesthetics a 7, this prioritises both the superior feel and the timeless look you want."
group = "Fabric"

[[principles]]
id = "build-every-outfit-from-cream-brown-"
text = "Build every outfit from cream, brown, and navy, using only one other colour from your palette."
reason = "This guarantees the 'tight, repeatable palette' and 'coherent' look you asked for while complementing your skin tone."
group = "Colour"

[[principles]]
id = "let-the-cut-and-fabric-be-the-focus-"
text = "Let the cut and fabric be the focus; limit accessories to your gold jewellery, a watch, and sunglasses."
reason = "The sophisticated Milanese style you admire relies on the quiet confidence of the clothes themselves, not on additional statements."
group = "Restraint"

[[principles]]
id = "keep-volume-in-one-place"
text = "Keep volume in one place."
reason = "Because."
group = "Silhouette"

[[principles]]
id = "keep-the-volume-in-one-place-only"
text = "Keep the volume in one place only."
reason = "At 1.76 m, loose on top and loose below reads as swamped rather than relaxed."
group = "Silhouette"

[[principles]]
id = "buy-the-shoulder-alter-everything-el"
text = "Buy the shoulder, alter everything else."
reason = "A shoulder seam cannot be moved; a sleeve and a waist can, cheaply."
group = "Silhouette"

[[principles]]
id = "build-every-outfit-from-two-base-col"
text = "Build every outfit from two base colours and at most one accent."
reason = "A tight palette means anything in the wardrobe combines without thinking."
group = "Colour"

[[principles]]
id = "keep-black-away-from-your-face"
text = "Keep black away from your face."
reason = "Warm medium-brown skin with a golden undertone goes flat against it; cream and navy do the opposite."
group = "Colour"

[[principles]]
id = "choose-cloth-with-visible-texture-ov"
text = "Choose cloth with visible texture over cloth with a pattern."
reason = "Texture reads as considered at three metres, pattern reads as effort."
group = "Fabric"

[[principles]]
id = "let-the-trouser-touch-the-shoe-once-"
text = "Let the trouser touch the shoe once and stop."
reason = "A quarter break is the difference between tailored and borrowed."
group = "Proportion"

[[principles]]
id = "one-thing-at-a-time-may-be-interesti"
text = "One thing at a time may be interesting."
reason = "If the overcoat is the event, the rest of the outfit is scenery."
group = "Restraint"

[[principles]]
id = "dress-one-notch-above-the-room-never"
text = "Dress one notch above the room, never two."
reason = "One notch reads as self-respect, two reads as a costume."
group = "Occasion"
