[[principles]]
id = "choose-cuts-that-taper-from-the-shou"
text = "Choose cuts that taper from the shoulder to the waist."
reason = "This follows your natural V-shape and avoids hiding your athletic build."
group = "Silhouette"

[[principles]]
id = "build-your-palette-around-warm-earth"
text = "Build your palette around warm, earthy tones."
reason = "These shades will complement the warm, golden undertones in your skin."
group = "Colour"

[[principles]]
id = "select-fabrics-that-drape-or-have-a-"
text = "Select fabrics that drape or have a fine texture over those that are stiff and bulky."
reason = "This will follow the lines of your lean physique rather than adding unflattering bulk."
group = "Fabric"

[[principles]]
id = "ensure-your-trousers-are-mid-to-high"
text = "Ensure your trousers are mid-to-high rise and your tops do not extend far past your hips."
reason = "This visually lengthens your legs and balances your vertical proportions."
group = "Proportion"

[[principles]]
id = "let-your-gold-jewelry-be-the-only-me"
text = "Let your gold jewelry be the only metallic accent."
reason = "This creates a cohesive personal signature and prevents competing details."
group = "Restraint"

[[principles]]
id = "for-any-occasion-include-at-least-on"
text = "For any occasion, include at least one structured garment."
reason = "A structured piece sharpens your look and makes the most of your defined shoulders."
group = "Occasion"
