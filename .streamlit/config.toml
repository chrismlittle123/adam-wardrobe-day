# Base theme. The rest of the styling lives in wardrobe/app.py so the two stay
# in one place; these are only the values Streamlit needs before first paint.
[theme]
base = "dark"
primaryColor = "#C9A227"
backgroundColor = "#17110E"
secondaryBackgroundColor = "#211915"
textColor = "#F0E6DB"
font = "sans serif"

[server]
runOnSave = true

[browser]
gatherUsageStats = false
