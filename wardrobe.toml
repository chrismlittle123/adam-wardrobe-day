[[items]]
id = "cream-camp-collar-shirt"
name = "Cream camp-collar shirt"
category = "Top"
garment = "Shirt"
colour = ""
colour_hex = "#F2E9D8"
fabric = ""
grade = ""
fit = ""
status = "owned"
photo = ""
description = ""
starred = false
product_photo = "out/products/cream-camp-collar-shirt.png"
product_copy = "**The cloth**\nA medium-weight cotton with a soft finish and some visible texture, like a slub or a fine weave. It needs enough body to hang from the shoulders without clinging, but enough drape to move easily and not look boxy. It will soften with wear and should not feel starchy or stiff off the rail.\n\n**The cut**\nA straight cut through the body, not a tapered 'slim fit'. The shoulders should be structured and sit squarely on your own, with the seam on the bone. From there, it should fall cleanly to a straight hem, with enough room in the chest and waist to not pull or feel restrictive. The camp collar should lie flat and open, forming a V-shape at the chest.\n\n**What to check**\n*   The shoulder seam. It must sit exactly on the point of your shoulder bone. If it’s right, the rest can be altered; if it’s wrong, put it back.\n*   The colour. It should be a warm, off-white cream, not a yellow-toned custard or a cold, stark white. Hold it against your skin.\n*   The transparency. Hold a single layer of the cloth up to the light. It should be opaque enough that your skin does not show through clearly.\n*   The collar's shape. The lapels should lie flat against the chest without curling up at the points or buckling away from the body.\n\n**Wrong version**\nThe wrong version is cut like a box, with no shape from the armpit to the hem, making you look wider than you are."

