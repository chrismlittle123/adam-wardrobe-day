product_copy = "**The cloth**\nA heavy cotton jersey, at least 220gsm, with a dry hand-feel. The weight gives it substance, so it hangs cleanly from the shoulders rather than clinging to the body. It should be completely opaque and have a visible, tight-knit texture. The cloth will soften with washing but hold its shape.\n\n**The cut**\nA long-sleeved T-shirt with a straight, structured fit. The shoulder seam should sit on the point of the shoulder. It is cut with room in the chest and biceps to accommodate an athletic frame, tapering slightly towards the waist to avoid a boxy shape. The hem should finish at the hip.\n\n**What to check**\n*   The shoulder seam must sit exactly on the edge of the shoulder bone.\n*   The fabric should feel substantial and not be see-through when held to the light.\n*   The body should hang straight down from the armpit without pulling at the waist or flaring out at the hem.\n*   The sleeve should end at the wrist bone and have enough room in the bicep for movement without being baggy.\n\n**Wrong version**\nThe wrong version is made from thin, clingy cloth with too much elastane that fits like a base layer."

