[answers]
says_what = "At work: competent and senior without looking like I am trying to be. Weekends: like I have a life outside a laptop."
never_look_like = "Trying too hard. A finance man on his day off. Anything that reads as a costume the second I walk into a room."
three_words = "Easy, sharp, warm."
audience = "Mostly myself, then the people I have dinner with. Not colleagues."
vibes_love = "Late-90s Milanese: soft shoulder, unstructured, nothing stiff. Also 70s tennis club, that ecru and forest green thing."
icons = "Marcello Mastroianni, but the ease rather than the suits. Paul Mescal when he gets the trousers right."
stolen_outfit = "Man outside a cafe on Marylebone High Street: brown suede blouson, white tee, grey flannel trousers, brown loafers. That was it."
world = "Rome 1962. Wong Kar-wai interiors. Old Italian football away kits."
try_hard = "Skinny jeans. Statement trainers. Big logos. Black shirts on a night out."
wrong_signal = "Three black going-out shirts from about 2019. A boxy navy puffer that makes me look square. Two pairs of grey marl joggers I wear in public."
missing = "A proper overcoat. Trousers that are not jeans. One good brown shoe."
actually_wear = "The same three tees, the dark jeans, the white trainers. Every single day."
never_worn = "A patterned short-sleeve shirt. Bought it excited, put it on once, felt like I was in fancy dress."
default_outfit = "Grey hoodie, dark jeans, white trainers, and I leave the house angry."
felt_great = "A wedding in Puglia. Cream linen shirt, stone trousers, brown suede shoes. I did not think about what I was wearing once all day."
keepers = "The cream camp-collar shirt. The navy hopsack blazer. The dark indigo jeans."
normal_week = "Three days in the office, two at home. Gym four mornings. Dinner out twice a week, usually somewhere unfussy. One proper night out a fortnight."
fit_preference = "Relaxed through the leg, close on the shoulder. Never tight on the arm."
flatter = "Happy to show the shoulders. Would rather nothing clung to the middle."
fit_problems = "Trousers fit the waist and swim on the thigh. Shirt sleeves always two centimetres too long. Jackets pull across the back."
palette_width = "Tight. I want to stop thinking about it in the morning."
fabrics = "Love wool, linen, heavy cotton. Cannot stand anything shiny or synthetic."
priorities = "Practicality 4, Comfort 5, Aesthetics 9, Cost 2"
upkeep = "Almost none. If it needs ironing it will not get worn, that is just true."
