[project]
name = "adam-wardrobe-day"
version = "0.1.0"
description = "Helping Adam level up his wardrobe, with a bit of Gemini image generation."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "google-auth>=2.30.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.62.0",
    "pillow>=12.3.0",
    "tomli-w>=1.2.0",
    "pillow-heif>=1.5.0",
    "watchdog>=6.0.0",
]

[project.scripts]
gemini-image = "wardrobe.gemini_image:main"
wardrobe-app = "wardrobe.app:main"
wardrobe-check = "wardrobe.cli:check"
wardrobe-reset = "wardrobe.cli:clear"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wardrobe"]
