# The subject of every generated look. This file is the single source of truth
# for who the model is; the app reads it, shows it, and folds it into every
# prompt sent to Gemini. Editable from the app's "Edit subject" panel.

[subject]
name = "Adam"
height_cm = 176
build = "very lean and athletic, narrow waist, defined shoulders"
body_fat_pct = 10

# Sampled from reference/adam-neutral.png: mean of forehead, both cheeks and
# nose bridge, excluding the stubble shadow along the jaw.
skin_tone_hex = "#C58466"
skin_tone = "warm medium brown with a golden undertone"

hair = "short dark natural curls, cropped close at the sides"
facial_hair = "light moustache and short stubble along the jaw"
eyes = "dark brown"
details = "small gold stud earring, thin gold chain necklace"

[photos]
# The head-on white-background portrait is the better generation base: plain
# background and square shoulders give the model far less to fight with.
neutral = "reference/adam-neutral.png"
original = "reference/adam.png"

[measurements]
# Centimetres, straight off a tape measure. Zero means "not measured yet", and
# the app estimates from height and build until a real number lands here.
# Everything in the Shopping Guide's size targets is derived from these, so the
# seven marked critical in fitspec.py are worth an evening with a tape.
neck = 0
chest = 0
waist = 0
seat = 0
shoulder = 0
sleeve = 0
back_length = 0
bicep = 0
wrist = 0
inseam = 0
outseam = 0
thigh = 0
knee = 0
ankle = 0
foot_length = 0
shoe_eu = 0

[style]
# Free text, folded into the prompt as standing direction for every look.
direction = "Relaxed European tailoring. Natural shoulder, nothing boxy, nothing skinny."
avoid = "Baggy fits, loud logos, novelty prints, black-on-black."
